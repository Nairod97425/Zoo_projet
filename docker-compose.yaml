# docker-compose.yaml
services:

  php:
    build: ./  # Utilise le Dockerfile local pour construire l'image
    volumes:
      - ./:/var/www/html  # Partage les fichiers du projet avec PHP
    networks:
      - app_network
    depends_on:
      - mysqldb 

  nginx:
    image: nginx:1.22-alpine
    ports:
      - "8080:80"  # Expose le port 80 de Nginx sur le port 8080 local
    volumes:
      - ./:/var/www/html  # Montre le projet local dans le conteneur
      - ./nginx.conf:/etc/nginx/nginx.conf  # Utilise un fichier nginx.conf personnalisé
    networks:
      - app_network
    depends_on:
      - php  # Assurez-vous que PHP démarre avant Nginx

   # Assurez-vous que MySQL est prêt avant PHP

  mysqldb:
    image: mysql:8.2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}  # Mot de passe root pour MySQL
      MYSQL_DATABASE: ${MYSQL_DATABASE}  # Nom de la base de données par défaut
      MYSQL_USER: ${MYSQL_USER}   # Utilisateur par défaut
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}  # Mot de passe de l'utilisateur
    volumes:
      - data:/var/lib/mysql  # Conserve les données MySQL dans un volume persistant
    networks:
      - app_network
    ports:
      - "${DB_PORT}:3306"  # Expose le port MySQL pour des connexions externes, assurez-vous que DB_PORT dans .env est correct

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysqldb  # Connecte PhpMyAdmin au conteneur MySQL
      PMA_PORT: 3306  # Correspond au port du conteneur mysqldb exposé en interne (pas celui du host)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}  # Fournit le mot de passe root à PhpMyAdmin
    ports:
      - "8081:80"  # Expose PhpMyAdmin sur le port 8081 local
    networks:
      - app_network
    depends_on:
      - mysqldb  # Assurez-vous que MySQL est prêt avant PhpMyAdmin

volumes:
  data:  # Volume persistant pour stocker les données MySQL

networks:
  app_network:
    driver: bridge  # Réseau par défaut pour connecter tous les conteneurs
