worker_processes 1;

events {
    worker_connections 1024;
}

pid /var/run/nginx.pid;  # Chemin adapté à Linux/Docker

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdn.jsdelivr.net https://maxcdn.bootstrapcdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;";

    server {
        listen 80;
        server_name localhost;

        # Redirection HTTP vers HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        # Certificat et clé privée
        ssl_certificate      /etc/nginx/certificates/cert.pem;
        ssl_certificate_key  /etc/nginx/certificates/cert.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_protocols TLSv1.2 TLSv1.3;  # Protocoles sécurisés
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        root /var/www/html/public;  # Chemin correct pour votre projet dans le conteneur
        index index.php;

        location / {
            try_files $uri /index.php$is_args$args;  # Gère les routes dynamiques
        }

        location ~ \.php$ {
            fastcgi_pass php:9000;  # Assurez-vous que PHP-FPM fonctionne sur ce port
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml)$ {
            expires 100d;  # Mise en cache des fichiers statiques
            log_not_found off;
        }

        error_log /var/log/nginx/error.log;  # Fichier de logs d'erreurs
        access_log /var/log/nginx/access.log;  # Fichier de logs d'accès
    }

    server {
        listen 8000;
        server_name somename;

        root /var/www/html;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}



