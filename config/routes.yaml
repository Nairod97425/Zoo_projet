controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

home:
    path: /
    controller: App\Controller\HomeController::index
    

app_register:
    path: /register
    controller: App\Controller\RegistrationController::register
    methods: ['GET', 'POST']

app_login:
    path: /login
    controller: App\Controller\SecurityController::login
    methods: ['GET', 'POST']
    
app_logout:
    path: /logout

app_employe_login:
    path: /employe/login
    controller: App\Controller\EmployeSecurityController::login

app_admin_dashboard:
    path: /admin/dashboard
    controller: App\Controller\AdminController::dashboard

app_veterinaire_dashboard:
    path: /veterinaire/dashboard
    controller: App\Controller\VeterinaireController::dashboard

app_employe_dashboard:
    path: /employe/dashboard
    controller: App\Controller\EmployeController::dashboard

#Gestion User

# Route pour la création d'un utilisateur
user_create:
    path: /admin/user/create
    controller: App\Controller\AdminController::createUser
    methods: [GET, POST]

# Route pour l'édition d'un utilisateur
user_edit:
    path: /admin/user/edit/{id}
    controller: App\Controller\AdminController::editUser
    methods: [GET, POST]

# Route pour la suppression d'un utilisateur
user_delete:
    path: /admin/user/delete/{id}
    controller: App\Controller\AdminController::deleteUser
    methods: [POST]

user_list:
    path: /admin/user/list_users
    controller: App\Controller\\AdminController::listUsers

#Gestion Habitat

# Route pour la création d'un habitat
habitat_new:
    path: /habitat/new
    controller: App\Controller\HabitatController::new
    methods: [GET, POST]

# Route pour l'édition d'un habitat
habitat_edit:
    path: /habitat/edit/{id}
    controller: App\Controller\HabitatController::edit
    methods: [GET, POST]

# Route pour la suppression d'un habitat
habitat_delete:
    path: /habitat/delete/{id}
    controller: App\Controller\HabitatController::delete
    methods: [POST]

habitat_index:
    path: /habitat
    controller: App\Controller\HabitatController::index

