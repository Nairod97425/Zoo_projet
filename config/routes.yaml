# config Contact
contact:
    path: /contact
    controller: App\Controller\ContactController::contact
    methods: [GET, POST]  # Méthodes HTTP autorisées (par exemple, GET pour afficher le formulaire et POST pour envoyer le message)


consultation_index:
    path: /consultations
    controller: App\Controller\ConsultationController::index

consultation_new:
    path: /consultations/new
    controller: App\Controller\ConsultationController::new

consultation_edit:
    path: /consultations/edit/{id}
