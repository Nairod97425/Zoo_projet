# config/routes.yaml

compte_rendu_new:
    path: /compte-rendu/new
    controller: App\Controller\CompteRenduController::new

compte_rendu_index:
    path: /compte-rendu
    controller: App\Controller\CompteRenduController::index

compte_rendu_edit:
    path: /compte-rendu/edit/{id}
    controller: App\Controller\CompteRenduController::edit
    requirements:
        id: \d+  # S'assure que l'id est un nombre

compte_rendu_delete:
    path: /compte-rendu/delete/{id}
    controller: App\Controller\CompteRenduController::delete
    methods: [POST]
    requirements:
        id: \d+  # S'assure que l'id est un nombre