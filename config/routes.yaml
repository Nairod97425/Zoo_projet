# Gérer le route des Avis
avis_index:
    path: /avis
    controller: App\Controller\AvisController::index

avis_new:
    path: /habitat/{id}/avis/new
    controller: App\Controller\AvisController::new

avis_edit:
    path: /avis/edit/{id}
