#Gestion Animal

# Route pour la creation des animaux
animal_create:
    path: /admin_animal/create
    controller: App\Controller\AdminAnimalController::create
    methods: [GET, POST]

# Route pour l'edition des animaux
animal_edit:
    path: /admin_animal/edit/{id}
    controller: App\Controller\AdminAnimalController::edit
    methods: [GET, POST]

# Route pour la suppression d'un animal
animal_delete:
    path: /admin_animal/delete/{id}
    controller: App\Controller\AdminAnimalController::delete
    methods: [POST]

animal_index:
    path: /admin_animal
    controller: App\Controller\AdminAnimalController::index

# Gérer les animaux pour l'admin
animal_manage:
    path: /admin/animal/manage_animals
    controller: App\Controller\AdminController::manageAnimals

admin_animal_new:
    path: /admin/animal/create
    controller: App\Controller\AdminController::createAnimal

admin_animal_edit:
    path: /admin/animal/edit/{id}
    controller: App\Controller\AdminController::editAnimal
    requirements:
        id: '\d+'  # Assure que l'id est un nombre

list_animal:
    path: /animal_user/list_animals/{habitatId}
    controller: App\Controller\AdminAnimalController::show
    requirements:
        habitatId: '\d+'

list_animal_employer:
    path: /animal/list/
    controller: App\Controller\AnimalController::index

admin_animal_delete:
    path: /admin/animal/delete/{id}
    controller: App\Controller\AdminController::deleteAnimal
    requirements:
        id: '\d+'  # Assure que l'id est un nombre
        
about:
    path: /about
    controller: App\Controller\AboutController::index

admin_list_user:
    path: /admin/user/list_users
    controller: App\Controller\AdminController::listUsers

admin_create_user:
    path: /admin/user/create
    controller: App\Controller\AdminController::createUser

admin_edit_user:
    path: /admin/user/edit/{id}
    controller: App\Controller\AdminController::editUser

admin_delete_user:
    path: /admin/user/delete/{id}
    controller: App\Controller\AdminController::deleteUser

