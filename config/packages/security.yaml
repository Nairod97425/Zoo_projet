
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        main:
            # C'est ici que vous configurez votre authentification
            pattern: ^/.*$
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _email
                password_parameter: _password
                csrf_parameter: _csrf_token
                enable_csrf: true
                csrf_token_id: authenticate
            logout:
                path: app_logout
                target: /
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/logout, roles: ROLE_USER }
        - { path: ^/admin_animal, roles: ROLE_EMPLOYE }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/veterinaire, roles: ROLE_VETERINAIRE }
        - { path: ^/avis, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/contact, roles: ROLE_USER }
        - { path: ^/employe, roles: ROLE_EMPLOYE }
        - { path: ^/animal/index, roles: ROLE_EMPLOYE }
        
